<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TEDxChuo U 進捗</title>
<style>
  :root{
    --red:#E62B1E; --yellow:#E9A800; --green:#1E9E5A; --gray:#9AA0A6;
    --ink:#141414; --sub:#5f6368; --line:#E7E7E7; --bg:#F6F5F3; --card:#fff;
    --radius:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;
    font-size:15px;line-height:1.5}
  button,input,select,textarea{font:inherit;color:inherit}
  .wrap{max-width:560px;margin:0 auto;padding:0 16px 110px}

  /* header */
  header{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:14px 16px 12px}
  header .in{max-width:560px;margin:0 auto}
  .brand{display:flex;align-items:baseline;gap:8px;justify-content:space-between}
  .brand h1{margin:0;font-size:17px;font-weight:800;letter-spacing:.02em}
  .brand h1 b{color:var(--red)}
  .brand a{color:#bbb;font-size:12px;text-decoration:none}
  .due{margin-top:6px;font-size:12.5px;color:#d0d0d0;display:flex;gap:10px;flex-wrap:wrap}
  .due strong{color:#fff}
  .due .late{color:#ff8a80}

  h2{font-size:13px;color:var(--sub);font-weight:700;margin:22px 2px 8px;letter-spacing:.04em}

  /* summary */
  .summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
  .sum{background:var(--card);border-radius:12px;padding:10px 8px;text-align:center;border:1px solid var(--line)}
  .sum .n{font-size:22px;font-weight:800;line-height:1.1}
  .sum .l{font-size:11px;color:var(--sub);white-space:nowrap}
  .sum.red .n{color:var(--red)} .sum.yellow .n{color:var(--yellow)} .sum.green .n{color:var(--green)} .sum.none .n{color:var(--gray)}

  /* dept cards */
  .card{background:var(--card);border-radius:var(--radius);border:1px solid var(--line);
    padding:14px 14px 12px 18px;margin-bottom:10px;position:relative;overflow:hidden;cursor:pointer}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--gray)}
  .card.red::before{background:var(--red)} .card.yellow::before{background:var(--yellow)} .card.green::before{background:var(--green)}
  .card.mine{border-color:var(--ink);box-shadow:0 2px 0 var(--ink)}
  .row1{display:flex;align-items:center;gap:8px}
  .row1 .name{font-weight:800;font-size:16px}
  .tag{font-size:11px;padding:2px 8px;border-radius:99px;background:#eee;color:var(--sub);font-weight:700}
  .tag.me{background:var(--ink);color:#fff}
  .pill{margin-left:auto;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:#f1f1f1;color:var(--sub);white-space:nowrap}
  .pill.red{background:#FDE7E5;color:var(--red)} .pill.yellow{background:#FFF4D1;color:#9a6c00} .pill.green{background:#E2F4EA;color:var(--green)}
  .tasks{white-space:pre-wrap;margin-top:6px;font-size:14px;color:#333}
  .kv{margin-top:6px;font-size:13px;color:#333}
  .kv span{color:var(--sub);margin-right:4px}
  .meta{margin-top:8px;font-size:12px;color:var(--sub);display:flex;justify-content:space-between}
  .empty{color:var(--gray);font-size:13.5px;margin-top:6px}

  /* my card */
  .mycard{background:var(--card);border:2px solid var(--ink);border-radius:var(--radius);padding:16px;margin-top:16px}
  .mycard .top{display:flex;align-items:center;gap:8px}
  .mycard .top .name{font-weight:800;font-size:18px}
  .mycard .state{margin:8px 0 12px;font-size:13.5px;color:var(--sub)}
  .mycard .state b.ok{color:var(--green)} .mycard .state b.ng{color:var(--red)}
  .lrow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin-bottom:8px;cursor:pointer}
  .lrow .dot{width:12px;height:12px;border-radius:50%;background:var(--gray);flex:none}
  .lrow.red .dot{background:var(--red)} .lrow.yellow .dot{background:var(--yellow)} .lrow.green .dot{background:var(--green)}
  .lrow .nm{font-weight:800;width:92px;flex:none}
  .lrow .st{flex:1;font-size:13.5px}
  .lrow .at{font-size:12px;color:var(--sub);white-space:nowrap}
  .lsub{font-size:12.5px;color:#444;margin:-4px 0 10px 36px}
  .helpbtn{background:none;border:1px solid #555;color:#ddd;border-radius:99px;font-size:12px;padding:2px 10px;cursor:pointer;margin-right:8px}
  .steps{margin:10px 0 0;padding:0;list-style:none;counter-reset:s}
  .steps li{counter-increment:s;position:relative;padding:0 0 14px 36px;font-size:14px}
  .steps li::before{content:counter(s);position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;background:var(--red);color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
  .legend div{display:flex;gap:8px;align-items:center;font-size:13.5px;margin:6px 0}
  .legend i{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none}

  /* pick dept */
  .pick{background:var(--card);border:1px dashed #bbb;border-radius:var(--radius);padding:14px;margin-top:16px}
  .pick p{margin:0 0 10px;font-weight:700}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 14px;font-weight:700;font-size:13.5px;cursor:pointer}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}

  /* handoff */
  .ho .what{font-weight:800;font-size:15.5px}
  .flow{font-size:13.5px;margin-top:4px;font-weight:700}
  .flow i{font-style:normal;color:var(--red);margin:0 6px}
  .ho select.st{margin-left:auto;border:1px solid var(--line);border-radius:99px;padding:4px 10px;background:#fff;font-size:12.5px;font-weight:700}
  .ho.done{opacity:.55}
  .ex{white-space:nowrap;display:inline-block;font-size:10.5px;background:#eee;color:#888;padding:1px 6px;border-radius:6px;margin-left:6px;vertical-align:2px}

  /* meeting */
  .agenda{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .step{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer}
  .step:first-child{border-top:none}
  .step .min{font-weight:800;width:42px;font-size:14px}
  .step .t{flex:1;font-size:14px}
  .step .clock{font-variant-numeric:tabular-nums;font-weight:800;color:var(--sub);font-size:13px}
  .step.run{background:#FFF7F6}
  .step.run .clock{color:var(--red)}
  .dec{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px}
  .dec .row1{margin-bottom:6px}

  /* forms */
  label.f{display:block;font-weight:700;font-size:13.5px;margin:16px 0 6px}
  label.f small{font-weight:400;color:var(--sub);margin-left:6px}
  .joinbtn{display:inline-block;background:var(--red);color:#fff !important;border-radius:99px;padding:1px 10px;font-weight:800;text-decoration:none;font-size:12px;margin-left:4px}
  input[type=text],input[type=date],input[type=time],input[type=url],textarea,select.in{width:100%;border:1px solid #d6d6d6;border-radius:10px;padding:10px 12px;background:#fff;outline:none}
  textarea{min-height:92px;resize:vertical}
  input:focus,textarea:focus,select:focus{border-color:var(--ink)}
  .hint{font-size:12px;color:var(--sub);margin-top:5px}
  .status-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .sopt{display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;cursor:pointer;text-align:left}
  .sopt .dot{width:16px;height:16px;border-radius:50%;flex:none;background:var(--gray)}
  .sopt.red .dot{background:var(--red)} .sopt.yellow .dot{background:var(--yellow)} .sopt.green .dot{background:var(--green)}
  .sopt b{display:block;font-size:14.5px}
  .sopt span{font-size:12.5px;color:var(--sub)}
  .sopt.on.red{border-color:var(--red);background:#FFF6F5}
  .sopt.on.yellow{border-color:var(--yellow);background:#FFFBEF}
  .sopt.on.green{border-color:var(--green);background:#F3FBF6}
  .askb{display:flex;gap:8px;margin-bottom:8px}
  .askb select{flex:1.1} .askb input{flex:1.3}
  .askb button{flex:none}
  .tip{background:#FFF8E1;border-radius:10px;padding:8px 12px;font-size:12.5px;margin-top:10px;color:#7a5a00}
  .err{color:var(--red);font-size:13px;margin-top:10px;font-weight:700}
  .btn.del{margin-top:18px;color:var(--red);border-color:#f3c2be;font-size:14px;padding:11px}
  .chip.delchip{margin:0 0 12px;color:var(--red);border-color:#f3c2be;font-size:12.5px}

  .btn{display:block;width:100%;border:none;border-radius:12px;padding:14px;font-weight:800;font-size:15.5px;cursor:pointer;background:var(--ink);color:#fff}
  .btn.red{background:var(--red)}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid #d6d6d6}
  .btn.sm{white-space:nowrap;flex:none;display:inline-block;width:auto;padding:9px 14px;font-size:13.5px;border-radius:10px}
  .btn:disabled{opacity:.5}
  .check{display:flex;gap:8px;align-items:flex-start;margin:14px 0;font-size:13.5px}
  .check input{margin-top:4px;width:18px;height:18px;accent-color:var(--ink)}

  /* bottom nav */
  nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:6;padding-bottom:env(safe-area-inset-bottom)}
  nav .in{max-width:560px;margin:0 auto;display:flex}
  nav .in button{flex:1}
  nav button[hidden]{display:none}
  nav button{border:none;background:none;padding:10px 0 12px;font-size:12px;font-weight:700;color:var(--gray);cursor:pointer}
  nav button .ic{display:block;font-size:19px;line-height:1.2}
  nav button.on{color:var(--ink)}
  nav button.on .ic{color:var(--red)}

  /* sheet modal */
  .mask{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:10;display:none}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;background:#fff;border-radius:18px 18px 0 0;
    max-height:92vh;overflow:auto;transform:translateY(105%);transition:transform .22s ease,visibility .22s;visibility:hidden;padding-bottom:env(safe-area-inset-bottom)}
  .sheet .in{max-width:560px;margin:0 auto;padding:8px 18px 22px}
  .sheet .grab{width:40px;height:4px;border-radius:9px;background:#ddd;margin:6px auto 4px}
  .sheet h3{margin:8px 0 2px;font-size:18px}
  .sheet .actions{position:sticky;bottom:0;background:#fff;padding:14px 0 4px;display:flex;gap:10px}
  .open .mask{display:block}
  .open .sheet{transform:translateY(0);visibility:visible}

  .toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;
    padding:10px 18px;border-radius:99px;font-size:13.5px;font-weight:700;opacity:0;transition:.2s;z-index:20;pointer-events:none;white-space:nowrap}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .loading{text-align:center;color:var(--sub);padding:60px 0}
  .spin{width:26px;height:26px;border:3px solid #ddd;border-top-color:var(--red);border-radius:50%;margin:0 auto 10px;animation:sp 0.8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .ilist{margin-top:6px}
  .irow{display:flex;gap:8px;align-items:flex-start;font-size:14px;margin:3px 0;white-space:pre-wrap}
  .idot{width:10px;height:10px;border-radius:50%;background:var(--gray);flex:none;margin-top:6px;display:inline-block}
  .idot.red{background:var(--red)} .idot.yellow{background:var(--yellow)} .idot.green{background:var(--green)}
  .isub{margin:0 0 4px 18px}
  details.arc{background:#fff;border:1px solid var(--line);border-radius:14px;margin-top:10px;overflow:hidden}
  details.arc summary{list-style:none;cursor:pointer;padding:13px 14px;display:flex;justify-content:space-between;align-items:center;font-size:15px}
  details.arc summary::-webkit-details-marker{display:none}
  details.arc summary span{font-size:12px;color:#888}
  details.arc[open] summary{border-bottom:1px solid var(--line)}
  .arcd{padding:11px 14px;border-bottom:1px solid #f0f0f0} .arcd:last-child{border-bottom:0}
  .arcdec{background:#eef6ff;border-radius:8px;padding:7px 9px;font-size:13.5px;margin:6px 0;white-space:pre-wrap}
  .arcdec span{display:block;font-size:11px;font-weight:700;color:#3466a8;margin-bottom:2px}
  .arct{font-size:13.5px;white-space:pre-wrap;margin-top:4px;color:#333}
  .xbox{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:8px;font-size:14px}
  .xbox .btns{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
  .remind{background:#fff6e5;border:1px solid #f5d38a;color:#7a5200;border-radius:10px;padding:9px 11px;font-size:13px;line-height:1.55;margin:-4px 0 12px}
  .remind div+div{margin-top:3px}
  .dtag{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;background:#eef1f5;color:#556;margin-left:2px;white-space:nowrap}
  .dtag.over{background:#fde8e8;color:var(--red)} .dtag.cnt{background:#fff4d6;color:#9a6b00} .dtag.done{background:#e6f6ec;color:#1f8f4e}
  .irow.isdone span{color:#999} .idot.done{background:#cfd6dd}
  .duerow{display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap}
  .duerow input[type=date]{border:1px solid #d6d6d6;border-radius:10px;padding:7px 10px;font-size:14px}
  .duerow label{font-size:13px;display:flex;align-items:center;gap:5px;white-space:nowrap}
  .titem{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:12px;background:#fcfcfc}
  .titem .head{display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:13.5px;margin-bottom:6px}
  .titem .rm{border:none;background:none;color:var(--sub);font-size:18px;cursor:pointer;padding:0 4px}
  .titem textarea{min-height:56px}
  .titem .status-opts{margin-top:8px}
  .titem .sopt{padding:8px 6px}
  .viewnote{background:#EEF4FF;color:#2a4a8a;border-radius:12px;padding:10px 14px;font-size:13px;margin-top:16px}
  .demo{background:#FFF3CD;color:#7a5a00;font-size:12px;text-align:center;padding:6px}
</style>
</head>
<body>
<div id="demo" class="demo" hidden>プレビュー表示（サンプルデータ）。シートには書き込まれません。</div>
<header><div class="in">
  <div class="brand"><h1><b>TEDx</b>Chuo U 進捗</h1><span><button class="helpbtn" onclick="openHelp()">使い方</button><a id="sheetLink" href="#" target="_blank">シート ↗</a></span></div>
  <div class="due" id="due"></div>
</div></header>

<div class="wrap">
  <section id="v-progress"><div class="loading"><div class="spin"></div>読み込み中…</div></section>
  <section id="v-handoff" hidden></section>
  <section id="v-meeting" hidden></section>
  <section id="v-archive" hidden></section>
</div>

<nav><div class="in">
  <button data-v="progress" class="on"><span class="ic">●</span>進捗</button>
  <button data-v="handoff"><span class="ic">⇄</span>引き継ぎ</button>
  <button data-v="archive"><span class="ic">▤</span>記録</button>
  <button data-v="meeting" id="navMeeting" hidden><span class="ic">◷</span>定例会</button>
</div></nav>

<div id="modal"><div class="mask" onclick="closeSheet()"></div><div class="sheet"><div class="in" id="sheetBody"></div></div></div>
<div class="toast" id="toast"></div>

<script>
/* ================= state ================= */
const DEPTS = ['Speaker','Finance','Design','Marketing','Operation','Organizer'];
const STATUS_HELP = {
  '緑': '予定どおり進んでいる',
  '黄': '遅れそうだが、部門内で解決できる',
  '赤': '他部門かOrganizerの判断が必要'
};
const S = { data:null, view:'progress', filter:'all', myDept:store('myDept'), myName:store('myName'), pin:store('pin') };
const API_URL = window.TEDX_API || (/github\.io$/.test(location.hostname) ? 'https://script.google.com/macros/s/AKfycbxQkAhOObYL4YPy8dMoGOeO3zhmJL7Ieq-WRhzgLcg4OYjUFeGm8Ko_xbpZPKdMq-W-OA/exec' : '');
const isRemote = !!API_URL;
const isLive = isRemote || (typeof google !== 'undefined' && google.script && google.script.run);
const MEMBER = 'Member';
function isViewer(){ return S.myDept===MEMBER; }
function canEdit(){ return !!S.myDept && !isViewer(); }
function unlocked(){ return !S.data || !S.data.pinRequired || !!S.pin; }
function isEditor(){ return canEdit() && unlocked(); }
function w(p){ return Object.assign({pin:S.pin}, p); }

function store(k, v){
  try{ if(v===undefined) return localStorage.getItem('tedx_'+k)||''; localStorage.setItem('tedx_'+k, v); }catch(e){ return ''; }
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function color(status){ const c=String(status||'').trim().charAt(0); return c==='赤'?'red':c==='黄'?'yellow':c==='緑'?'green':''; }
function $(id){ return document.getElementById(id); }
function rank(s){ const c=color(s); return c==='red'?3:c==='yellow'?2:c==='green'?1:0; }
function effOf(it){ return it.eff || it.status; }
function dueLabel(it){
  if(it.done) return '<span class="dtag done">完了</span>';
  if(!it.due) return '';
  const d=parseYmd(it.due); const t=d?md(d):esc(it.due);
  return '<span class="dtag'+(it.overdue?' over':'')+'">'+(it.overdue?'期限切れ ':'期限 ')+t+'</span>'+
    (it.dueCount?'<span class="dtag cnt">延期'+it.dueCount+'回</span>':'');
}
function itemsHtml(items, detail){
  return '<div class="ilist">'+(items||[]).map(it=>{
    const c=it.done?'done':color(effOf(it)), bad=(c==='red'||c==='yellow');
    return '<div class="irow'+(it.done?' isdone':'')+'"><i class="idot '+c+'"></i><span>'+esc(it.text)+' '+dueLabel(it)+'</span></div>'+
      (detail && it.dueCount && it.dueNote && !it.done ? '<div class="kv isub"><span>延期理由</span>'+esc(it.dueNote)+'</div>':'')+
      (detail && bad ? (it.reason?'<div class="kv isub"><span>理由</span>'+esc(it.reason)+'</div>':'')+(it.ask?'<div class="kv isub"><span>依頼</span>'+esc(it.ask)+'</div>':'') : '');
  }).join('')+'</div>';
}
function daysTo(ymd){ const d=parseYmd(ymd); if(!d) return null; const t=new Date(); t.setHours(0,0,0,0); return Math.round((d-t)/86400000); }
function remindHtml(d, updated){
  const open=(d.items||[]).filter(it=>!it.done);
  if(!open.length) return '';
  const over=open.filter(it=>it.overdue), soon=open.filter(it=>!it.overdue && it.due && daysTo(it.due)!==null && daysTo(it.due)<=3);
  const lines=[];
  if(!updated) lines.push('前回の黄・赤のやることが <b>'+open.length+'件</b> 持ち越されています。状況・期限を確認し、新しいやることも書いてください。');
  if(over.length) lines.push('🔴 期限切れ：'+over.map(it=>esc(it.text)).join('、'));
  if(soon.length) lines.push('⏰ 3日以内に期限：'+soon.map(it=>esc(it.text)+'（'+md(parseYmd(it.due))+'）').join('、'));
  return lines.length?'<div class="remind">'+lines.map(l=>'<div>'+l+'</div>').join('')+'</div>':'';
}
function badItems(d){ return (d.items||[]).filter(it=>!it.done && rank(effOf(it))>=2); }
const WD = ['日','月','火','水','木','金','土'];
function md(d){ return (d.getMonth()+1)+'/'+d.getDate()+'('+WD[d.getDay()]+')'; }
function parseYmd(s){ const m=String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})/); return m?new Date(+m[1],+m[2]-1,+m[3]):null; }
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2200); }

/* ================= API ================= */
function api(fn, ...args){
  const p = isRemote ? fetch(API_URL, {method:'POST', credentials:'omit', redirect:'follow',
        headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({fn, args})})
      .then(r=>r.json()).then(j=>{ if(!j.ok) throw new Error(j.error); return j.data; })
    : isLive ? new Promise((res, rej)=>{
      google.script.run.withSuccessHandler(res).withFailureHandler(e=>rej(e&&e.message?e:new Error(String(e))))[fn](...args);
    }) : Mock[fn](...args);
  return p.catch(e=>{
    if(String(e&&e.message).indexOf('PIN_NG')!==-1){
      S.pin=''; store('pin',''); setTimeout(askPin, 400);
      throw new Error('編集用パスワードが違います。もう一度入力してください。');
    }
    throw e;
  });
}

function deadline(){
  const m = parseYmd(S.data.meetingDate); if(!m) return null;
  return new Date(m.getFullYear(), m.getMonth(), m.getDate()-1, 21, 0);
}
function nextAllHands(){
  const t = new Date(); t.setHours(0,0,0,0);
  for(let k=0;k<3;k++){ const f = new Date(t.getFullYear(), t.getMonth()+k, 1); while(f.getDay()!==4) f.setDate(f.getDate()+1); if(f>=t) return f; }
}
function renderHeader(){
  if(!isEditor()){ $('due').innerHTML='次の全体会議：<strong>'+md(nextAllHands())+'</strong>（毎月第1木曜）'; return; }
  const m = parseYmd(S.data.meetingDate), dl = deadline();
  if(!m){ $('due').innerHTML='次のDirector定例会：<strong>日程調整中</strong>（決まったらお知らせします）'; return; }
  const diff = dl - new Date();
  let left;
  if(diff<=0) left = '<span class="late">締め切りを過ぎています</span>';
  else { const h=Math.floor(diff/36e5); left = 'あと <strong>'+(h>=24? Math.floor(h/24)+'日'+(h%24)+'時間' : h+'時間'+Math.floor(diff%36e5/6e4)+'分')+'</strong>'; }
  const tm = S.data.meetingTime ? ' '+esc(S.data.meetingTime) : S.data.meetingNote ? ' '+esc(S.data.meetingNote) : '';
  const join = (S.data.meetingLink && !S.data.meetingNote) ? '<a class="joinbtn" href="'+esc(S.data.meetingLink)+'" target="_blank" rel="noopener">参加する ↗</a>' : '';
  $('due').innerHTML = 'Director定例会 <strong>'+md(m)+tm+'</strong>'+join+' ・ 更新締め切り <strong>'+md(dl)+' 21:00</strong> ・ '+left;
}

function syncED(){
  ED.items.forEach((it,i)=>{
    const t=$('t_text_'+i), r=$('t_reason_'+i), a=$('t_ask_'+i), du=$('t_due_'+i), dn=$('t_done_'+i), nt=$('t_note_'+i);
    if(t) it.text=t.value; if(r) it.reason=r.value; if(a) it.ask=a.value;
    if(du) it.due=du.value; if(dn) it.done=dn.checked; if(nt) it.newNote=nt.value;
  });
  const n=$('p_name'); if(n) S.myName=n.value;
}

function addItem(){ syncED(); ED.items.push({text:'',status:'',reason:'',ask:'',due:'',origDue:'',done:false,dueCount:0,dueNote:'',newNote:''}); renderEditor(); }

function saveProgress(){
  syncED();
  const items = ED.items.map(it=>{
      const moved = !!it.origDue && it.due!==it.origDue && !it.done;
      return {text:it.text.trim(), status:it.status, reason:it.reason.trim(), ask:it.ask.trim(), due:it.due, done:it.done,
        dueCount:(it.dueCount||0)+(moved?1:0), dueNote:moved?it.newNote.trim():it.dueNote, _moved:moved};
    }).filter(it=>it.text || it.status);
  const by = ($('p_name').value||'').trim();
  let err = !items.length ? 'やることを1つ以上書いてください' : '';
  items.forEach((it,i)=>{
    if(err) return;
    const c=color(it.status), n='やること'+(i+1)+'：';
    if(it.done && !it.status) it.status = S.data.statusOptions[0];
    if(!it.text) err=n+'内容を書いてください';
    else if(it._moved && !it.dueNote) err=n+'期限を変える理由を書いてください';
    else if(it.done){ /* 完了なら理由などは不要 */ }
    else if(!it.status) err=n+'状況を選んでください';
    else if((c==='red'||c==='yellow') && !it.reason) err=n+'理由を書いてください';
    else if(c==='red' && !it.ask) err=n+'赤のときは「誰に・いつまでに」を書いてください';
    else if(it.ask && it.ask.indexOf('：')===-1 && it.ask.indexOf(':')===-1) err=n+'「部門名：期限」の形で書いてください（例：Design：11/18まで）';
    if(c==='green'){ it.reason=''; it.ask=''; }
    delete it._moved;
  });
  if(!err && !by) err='名前を書いてください';
  if(err){ $('p_err').textContent=err; return; }
  S.myName=by; store('myName', by);
  busy('p_save', true);
  api('saveProgress', w({dept:ED.name, items, by})).then(d=>{ closeSheet(); setData(d); toast('保存しました'); })
    .catch(e=>{ $('p_err').textContent=e.message; busy('p_save', false); });
}

/* ================= 引き継ぎ ================= */
function involves(h, dept){ return String(h.from).indexOf(dept)!==-1 ? 'from' : String(h.to).indexOf(dept)!==-1 ? 'to' : ''; }
function isDone(h){ return /完了|済/.test(h.status); }
function renderHandoff(){
  const my = isEditor() ? S.myDept : '';
  const filters = [['all','すべて'],['open','未完了']].concat(my?[['from','渡す'],['to','受け取る']]:[]);
  let list = S.data.handoffs.slice();
  if(S.filter==='open') list = list.filter(h=>!isDone(h));
  if(S.filter==='from') list = list.filter(h=>involves(h,my)==='from');
  if(S.filter==='to') list = list.filter(h=>String(h.to).indexOf(my)!==-1);
  let h = '<div class="chips" style="margin-top:16px">'+filters.map(f=>'<button class="chip'+(S.filter===f[0]?' on':'')+'" onclick="S.filter=\''+f[0]+'\';render()">'+f[1]+'</button>').join('')+'</div>';
  h += '<h2>部門間の引き継ぎ（「どの状態で」は受け取る側が決める）</h2>';
  const exs = S.data.handoffs.filter(x=>/例/.test(x.memo));
  if(exs.length && isEditor()) h += '<button class="chip delchip" onclick="delExamples()">記入例（'+exs.length+'件）をまとめて削除</button>';
  if(!list.length) h += '<div class="empty" style="padding:20px 4px">該当する引き継ぎはありません</div>';
  list.forEach(x=>{
    const ex = /例/.test(x.memo);
    h += '<div class="card ho'+(isDone(x)?' done':'')+'"'+(isEditor()?' onclick="openHandoff('+x.row+')"':' style="cursor:default"')+'>'+
      '<div class="row1"><span class="what">'+esc(x.what)+(ex?'<span class="ex">記入例</span>':'')+'</span>'+
      (isEditor() ? '<select class="st" onclick="event.stopPropagation()" onchange="quickStatus('+x.row+',this.value)">'+
        S.data.handoffStatusOptions.map(o=>'<option'+(o===x.status?' selected':'')+'>'+esc(o)+'</option>').join('')+
        (S.data.handoffStatusOptions.indexOf(x.status)===-1 && x.status ? '<option selected>'+esc(x.status)+'</option>':'')+
      '</select>' : '<span class="pill">'+esc(x.status||'—')+'</span>')+'</div>'+
      '<div class="flow">'+esc(x.from)+'<i>→</i>'+esc(x.to)+'</div>'+
      (x.due?'<div class="kv"><span>期限</span>'+esc(x.due)+'</div>':'')+
      (x.state?'<div class="kv"><span>状態</span>'+esc(x.state)+'</div>':'')+
      (x.checker?'<div class="kv"><span>確認</span>'+esc(x.checker)+'</div>':'')+
      (x.memo && !ex?'<div class="kv"><span>メモ</span>'+esc(x.memo)+'</div>':'')+
    '</div>';
  });
  if(isEditor()) h += '<button class="btn" style="margin-top:14px" onclick="openHandoff(0)">＋ 引き継ぎを追加</button>';
  $('v-handoff').innerHTML = h;
}
function quickStatus(row, val){
  const x = S.data.handoffs.find(h=>h.row===row);
  api('saveHandoff', w({row, originalWhat:x.what, status:val})).then(d=>{ setData(d); toast('「'+x.what+'」を'+val+'にしました'); })
    .catch(e=>{ toast(e.message); load(); });
}
function openHandoff(row){
  const x = row ? S.data.handoffs.find(h=>h.row===row) : {what:'',from:S.myDept||'',to:'',due:'',state:'',checker:'',status:S.data.handoffStatusOptions[0],memo:''};
  const deptOpts = sel => '<option value=""></option>'+DEPTS.map(d=>'<option'+(d===sel?' selected':'')+'>'+d+'</option>').join('')+(sel && DEPTS.indexOf(sel)===-1?'<option selected>'+esc(sel)+'</option>':'');
  openSheet(
    '<h3>'+(row?'引き継ぎを編集':'引き継ぎを追加')+'</h3>'+
    '<label class="f">何を</label><input type="text" id="h_what" value="'+esc(x.what)+'" placeholder="例：キービジュアル">'+
    '<div style="display:flex;gap:10px"><div style="flex:1"><label class="f">誰から</label><select class="in" id="h_from">'+deptOpts(x.from)+'</select></div>'+
    '<div style="flex:1"><label class="f">誰へ</label><input type="text" id="h_to" value="'+esc(x.to)+'" placeholder="例：Marketing"></div></div>'+
    '<label class="f">いつまでに</label><input type="text" id="h_due" value="'+esc(x.due)+'" placeholder="例：11/20(金)">'+
    '<div class="askb" style="margin:8px 0 0"><input type="date" id="h_dueDate" onchange="pickDue()" style="flex:1"><span class="hint" style="flex:1.4;align-self:center;margin:0">← 日付を選ぶと自動で入ります</span></div>'+
    '<div class="hint">「11/20」のように日付が入っていると、3日前に担当部門のSlackへリマインドが届きます。</div>'+
    '<label class="f">どの状態で <small>受け取る側が決める</small></label><input type="text" id="h_state" value="'+esc(x.state)+'" placeholder="例：SNS用の2サイズ＋編集データ">'+
    '<label class="f">受け取り確認</label><input type="text" id="h_checker" value="'+esc(x.checker)+'" placeholder="例：Marketing Director">'+
    '<label class="f">状況</label><select class="in" id="h_status">'+S.data.handoffStatusOptions.map(o=>'<option'+(o===x.status?' selected':'')+'>'+esc(o)+'</option>').join('')+'</select>'+
    '<label class="f">メモ</label><input type="text" id="h_memo" value="'+esc(/^（例）$/.test(x.memo)?'':x.memo)+'">'+
    (row && /例/.test(x.memo)?'<div class="hint">記入例の行です。保存すると「（例）」が消えて本番の行になります。</div>':'')+
    (row?'<button type="button" class="btn ghost del" onclick="delHandoff('+row+')">この引き継ぎを削除</button>':'')+
    '<div class="err" id="h_err"></div>'+
    '<div class="actions"><button class="btn ghost" onclick="closeSheet()" style="flex:1">キャンセル</button><button class="btn" id="h_save" style="flex:2" onclick="saveHandoff('+row+')">保存する</button></div>'
  );
}
function pickDue(){ const d=parseYmd($('h_dueDate').value); if(d) $('h_due').value=md(d); }
function saveHandoff(row){
  const x = row ? S.data.handoffs.find(h=>h.row===row) : null;
  const p = { what:$('h_what').value.trim(), from:$('h_from').value, to:$('h_to').value.trim(), due:$('h_due').value.trim(),
    state:$('h_state').value.trim(), checker:$('h_checker').value.trim(), status:$('h_status').value, memo:$('h_memo').value.trim() };
  if(!p.what||!p.from||!p.to||!p.due){ $('h_err').textContent='「何を・誰から・誰へ・いつまでに」は必須です'; return; }
  if(row){ p.row=row; p.originalWhat=x.what; }
  busy('h_save', true);
  api('saveHandoff', w(p)).then(d=>{ closeSheet(); setData(d); toast('保存しました'); })
    .catch(e=>{ $('h_err').textContent=e.message; busy('h_save', false); });
}

/* ================= 定例会 ================= */
const AGENDA = [[5,'今日扱う赤・黄を確認'],[20,'止まっていることを1つずつ解決し、「誰が・何を・いつまでに」を決める'],[10,'2週間以内の引き継ぎを確認'],[5,'決まったことを書く（下の欄）']];
const T = { idx:-1, end:0, iv:null };
const decisions = {};
function renderMeeting(){
  const ds = S.data.depts.filter(d=>!d.missing);
  const hot = ds.filter(d=>color(d.status)==='red').concat(ds.filter(d=>color(d.status)==='yellow'));
  const openHo = S.data.handoffs.filter(h=>!isDone(h) && !/例/.test(h.memo));
  let h = '<label class="f" style="margin-top:18px">次の定例会（日付・開始時刻・会議リンク）</label>'+
    '<div style="display:flex;gap:8px"><input type="date" id="m_date" value="'+esc(S.data.meetingDate)+'" style="flex:1.4"><input type="time" id="m_time" value="'+esc(S.data.meetingTime||'')+'" style="flex:1"></div>'+
    '<input type="url" id="m_link" value="'+esc(S.data.meetingLink||'')+'" placeholder="会議リンク（Zoom・Google Meetなど）" style="margin-top:8px">'+
    '<button class="btn sm" style="margin-top:8px" onclick="saveDate()">設定</button>'+
    '<div class="hint">ふだんは自動で入ります（毎月第1木曜：全体会議終了後・対面／忙しい月は第3月曜 20:30・オンライン）。日付や時刻を変えたいときだけ、ここで直して「設定」。</div>'+
    extraHtml();
  h += '<h2>進め方（タップでタイマー）</h2><div class="agenda">'+AGENDA.map((a,i)=>
    '<div class="step'+(T.idx===i?' run':'')+'" onclick="startStep('+i+')"><span class="min">'+a[0]+'分</span><span class="t">'+a[1]+'</span><span class="clock" id="clk'+i+'">'+(T.idx===i?'':'▶')+'</span></div>').join('')+'</div>'+
    '<div class="hint">緑の部門は発言なしでOK。部門内の細かい話は会議の後で。</div>';
  h += '<h2>今日扱う部門（赤・黄）</h2>';
  if(!hot.length) h += '<div class="empty" style="padding:6px 4px 4px">赤・黄の部門はありません 🎉</div>';
  hot.forEach(d=>{ const c=color(d.status);
    h += '<div class="card '+c+'" style="cursor:default"><div class="row1"><span class="name">'+esc(d.name)+'</span><span class="pill '+c+'">'+esc(d.status)+'</span></div>'+
      itemsHtml(badItems(d),true)+'</div>';
  });
  h += '<h2>未完了の引き継ぎ（'+openHo.length+'件）</h2>';
  openHo.forEach(x=>{ h += '<div class="kv" style="margin:0 2px 6px">・<b>'+esc(x.what)+'</b>　'+esc(x.from)+' → '+esc(x.to)+'　<span>'+esc(x.due)+'</span>（'+esc(x.status)+'）</div>'; });
  if(!openHo.length) h += '<div class="empty" style="padding:0 4px">なし</div>';
  h += '<h2>会議で決まったこと（誰が・何を・いつまでに）</h2>';
  hot.concat(ds.filter(d=>hot.indexOf(d)===-1)).forEach(d=>{ const c=color(d.status);
    h += '<div class="dec"><div class="row1"><span class="name" style="font-size:14.5px">'+esc(d.name)+'</span><span class="pill '+c+'">'+(d.status?esc(d.status):'未記入')+'</span></div>'+
      '<textarea style="min-height:60px" placeholder="例：Grace が テーマ説明文を 11/10 までに共有" oninput="decInput(\''+d.name+'\',this)">'+esc(decisions[d.name]||'')+'</textarea></div>';
  });
  h += '<label class="check"><input type="checkbox" id="m_clear" checked><span>アーカイブ後、次の期間へ切り替える（完了・緑のやることは消え、黄・赤のやることだけ期限ごと持ち越し）</span></label>'+
    '<label class="f" style="margin-top:4px">次の定例会の日付 <small>任意・アーカイブと同時に設定</small></label><input type="date" id="m_next">'+
    '<div class="err" id="m_err"></div>'+
    '<button class="btn red" style="margin-top:14px" onclick="confirmArchive()">今すぐアーカイブする</button>'+
    '<div class="hint" style="text-align:center">書いた「決まったこと」は自動で保存され、<b>定例会の翌朝9時に自動でアーカイブ</b>されます（次の日程も自動で入ります）。急ぐときだけこのボタンを押してください。</div>';
  $('v-meeting').innerHTML = h;
  if(T.idx>=0) tick();
}
function startStep(i){
  if(T.idx===i){ clearInterval(T.iv); T.idx=-1; renderMeeting(); return; }
  clearInterval(T.iv); T.idx=i; T.end=Date.now()+AGENDA[i][0]*60000;
  T.iv=setInterval(tick, 1000); renderMeeting();
}
function tick(){
  const el=$('clk'+T.idx); if(!el) return;
  const s=Math.max(0, Math.round((T.end-Date.now())/1000));
  el.textContent = Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
  if(s===0){ clearInterval(T.iv); el.textContent='時間です'; try{ navigator.vibrate&&navigator.vibrate(300); }catch(e){} }
}
function extraHtml(){
  const e=S.data.extra; if(!e) return '';
  const d=parseYmd(e.date), ck=parseYmd(e.check);
  let st, why;
  if(e.mode==='on'){ st='開催する'; why='手動で「追加」にしています'; }
  else if(e.mode==='off'){ st='開催しない'; why='手動で「なし」にしています'; }
  else if(e.auto){ st=e.on?'開催する':'開催しない'; why=md(ck)+'の進捗で自動判定（赤1つ以上 または 黄3部門以上で開催）'; }
  else { st='未定'; why=md(ck)+'の朝に、進捗を見て自動で決まります（赤1つ以上 または 黄3部門以上で開催）'; }
  return '<div class="xbox"><b>'+md(d)+' 20:30 オンライン定例会（第3月曜）</b>：<b>'+st+'</b><div class="hint" style="margin:4px 0 0">'+why+'</div>'+
    '<div class="btns"><button class="chip" onclick="setExtra(\'on\')">追加する</button><button class="chip" onclick="setExtra(\'off\')">なしにする</button>'+
    (e.mode!=='auto'?'<button class="chip" onclick="setExtra(\'auto\')">自動判定に戻す</button>':'')+'</div></div>';
}
function setExtra(mode){
  api('setExtra', w({ym:S.data.extra.ym, mode})).then(d=>{ setData(d); toast('設定しました'); }).catch(e=>toast(e.message));
}
let decTimer=null, decDirty=false;
function decInput(name, el){
  decisions[name]=el.value; decDirty=true;
  clearTimeout(decTimer);
  decTimer=setTimeout(()=>{ api('saveDecisions', w({decisions})).then(()=>{ decDirty=false; }).catch(()=>{}); }, 800);
}
function saveDate(){
  api('setMeetingDate', w({date:$('m_date').value, time:$('m_time').value, link:$('m_link').value.trim()})).then(d=>{ setData(d); toast('定例会の予定を設定しました'); }).catch(e=>toast(e.message));
}
function confirmArchive(){
  const clear=$('m_clear').checked, next=$('m_next').value;
  openSheet('<h3>アーカイブしますか？</h3>'+
    '<p style="font-size:14px">全部門の進捗と「会議で決まったこと」を「アーカイブ」タブに追加します。'+
    (clear?'<br><b>その後、完了・緑のやることは消え、黄・赤のやることだけが次の期間に持ち越されます。各部門は「まだ更新していません」に戻ります。</b>':'')+
    (next?'<br>次の定例会：<b>'+md(parseYmd(next))+'</b>':'')+'</p>'+
    '<div class="err" id="a_err"></div>'+
    '<div class="actions"><button class="btn ghost" onclick="closeSheet()" style="flex:1">戻る</button><button class="btn red" id="a_go" style="flex:2" onclick="doArchive('+clear+',\''+next+'\')">アーカイブする</button></div>');
}
function doArchive(clear, next){
  busy('a_go', true);
  api('archiveWeek', w({decisions, clear, nextDate:next})).then(d=>{
    Object.keys(decisions).forEach(k=>delete decisions[k]);
    closeSheet(); setData(d); toast('アーカイブしました');
  }).catch(e=>{ $('a_err').textContent=e.message; busy('a_go', false); });
}

/* ================= 削除 ================= */
function confirmBox(title, msg, okLabel, run, done){
  openSheet('<h3>'+title+'</h3><p style="font-size:14px">'+msg+'</p><div class="err" id="c_err"></div>'+
    '<div class="actions"><button class="btn ghost" onclick="closeSheet()" style="flex:1">戻る</button><button class="btn red" id="c_go" style="flex:2">'+okLabel+'</button></div>');
  $('c_go').onclick=()=>{ busy('c_go', true, '処理中…'); run().then(d=>{ closeSheet(); setData(d); toast(done); }).catch(e=>{ $('c_err').textContent=e.message; busy('c_go', false); }); };
}
function delHandoff(row){
  const x = S.data.handoffs.find(h=>h.row===row);
  confirmBox('引き継ぎを削除しますか？', '「<b>'+esc(x.what)+'</b>」をシートから削除します。元に戻せません。', '削除する',
    ()=>api('deleteHandoff', w({items:[{row:x.row, what:x.what}]})), '削除しました');
}
function delExamples(){
  const exs = S.data.handoffs.filter(x=>/例/.test(x.memo));
  confirmBox('記入例をまとめて削除しますか？', exs.map(x=>'・'+esc(x.what)).join('<br>')+'<br><br>この'+exs.length+'件をシートから削除します。元に戻せません。', 'まとめて削除',
    ()=>api('deleteHandoff', w({items:exs.map(x=>({row:x.row, what:x.what}))})), '記入例を削除しました');
}
function clearDept(name){
  confirmBox(esc(name)+'の入力をクリアしますか？', 'やること・状況・理由・依頼・更新者・更新日を空にします（部門名は残ります）。', 'クリアする',
    ()=>api('clearProgress', w({dept:name})), 'クリアしました');
}

/* ================= sheet modal ================= */
function openSheet(html){ $('sheetBody').innerHTML='<div class="grab"></div>'+html; $('modal').classList.add('open'); document.body.style.overflow='hidden'; }
function closeSheet(){ $('modal').classList.remove('open'); document.body.style.overflow=''; }
function busy(id, on, label){ const b=$(id); if(!b) return; b.disabled=on; if(on){ b.dataset.t=b.textContent; b.textContent=label||'保存中…'; } else if(b.dataset.t){ b.textContent=b.dataset.t; } }

if(!isLive) $('demo').hidden=false;
syncNav();
if(!S.myDept) setTimeout(openHelpOnce, 800);
function openHelpOnce(){ if(!store('seenHelp')){ store('seenHelp','1'); openHelp(); } }
load();
</script>
